# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: agent + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# Service `agent` (đã hoàn thành):
#   [x] build từ Dockerfile trong thư mục hiện tại
#   [x] cổng ra ngoài do nginx nhận (8000:80) để `--scale agent=3` không tranh cổng
#   [x] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${AGENT_API_KEY}` (docker compose tự đọc từ file .env cùng thư mục)
#   [x] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [x] depends_on: redis
#   [x] healthcheck gọi /health
#
# Service `nginx` (đã thêm ở CP4) làm load balancer, dùng nginx/nginx.conf có sẵn:
#     docker compose up -d --scale agent=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  agent:
    # Build image từ Dockerfile ở thư mục hiện tại (multi-stage, non-root).
    build: .

    # CỐ Ý không có `ports:` ở service này. Nếu map cổng host cố định
    # ("8000:8000") thì `--scale agent=3` sẽ có 3 container cùng đòi cổng 8000
    # và lỗi "port is already allocated". Thay vào đó agent chỉ mở cổng trong
    # mạng nội bộ của compose, còn nginx (bên dưới) là cửa duy nhất ra ngoài
    # và chia request cho các bản sao agent.
    expose:
      - "8000"

    environment:
      # Nội suy ${...}: compose tự đọc giá trị từ file `.env` cùng thư mục.
      # KHÔNG viết khóa thật vào file này vì docker-compose.yml được commit.
      AGENT_API_KEY: ${AGENT_API_KEY}
      # Trong compose, hostname của một container chính là TÊN SERVICE.
      # `localhost` trong container agent là chính agent, không phải Redis,
      # nên dùng localhost ở đây sẽ báo "Connection refused".
      REDIS_URL: redis://redis:6379/0

    # Chờ redis healthy (không chỉ "đã start") rồi mới bật agent, tránh agent
    # khởi động khi Redis chưa nhận kết nối.
    depends_on:
      redis:
        condition: service_healthy

    # Cùng ý với HEALTHCHECK trong Dockerfile, nhưng để compose biết khi nào
    # agent sẵn sàng (hiện ở cột STATUS của `docker compose ps`).
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Load balancer: nhận request ở cổng host 8000 và chia vòng tròn (round-robin)
  # cho mọi bản sao của `agent`. Docker DNS trả về IP của cả 3 container khi
  # hỏi hostname `agent`. Nhờ vậy `curl localhost:8000/...` dùng được dù chạy
  # 1 hay 3 instance, và history_length vẫn tăng dần khi request rơi vào các
  # container khác nhau — bằng chứng app stateless (state nằm ở Redis).
  #     docker compose up -d --scale agent=3
  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      # :ro = chỉ đọc, container không sửa được file cấu hình trên máy bạn
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      agent:
        condition: service_healthy

volumes:
  redis-data:
